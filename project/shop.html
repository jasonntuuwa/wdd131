<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Aethelon</title>
    <meta name="description"
        content="Browse Aethelon's collection of activewear, casual essentials, and tailored jackets.">
    <meta name="author" content="Jason Ntuuwa">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">

<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">Aethelon</a>
        <ul class="nav-links">
            <li><a href="shop.html">Shop</a></li>
            <li><a href="fabric.html">Our Fabric</a></li>
            <li><a href="join.html">Join the Club</a></li>
        </ul>
        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    </nav>

    <main>
        <section class="hero">
            <img src="images/project/images/brand-logo.jpg"
                alt="Aethelon brand illustration: a classical column fused with dynamic motion lines" width="400"
                height="280" class="hero-image">
            <h1>Shop the Collection</h1>
            <p>Performance-tested fabric, built for the transition between training and everyday life.</p>
        </section>

        <section class="section-container" aria-labelledby="shop-heading">
            <h2 id="shop-heading">All Products</h2>

            <div class="filter-bar" role="group" aria-label="Filter products by category">
                <button class="filter-btn" data-category="all">All</button>
                <button class="filter-btn" data-category="activewear">Activewear</button>
                <button class="filter-btn" data-category="casual">Casual Essentials</button>
                <button class="filter-btn" data-category="tailored">Tailored Jackets</button>
            </div>

            <div class="grid-layout" id="product-grid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <ul class="footer-links">
            <li><a href="faq.html">FAQs</a></li>
            <li><a href="returns.html">Returns</a></li>

            <li><a href="references.html">References</a></li>
        </ul>
